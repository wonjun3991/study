apiVersion: v1
kind: Pod
metadata:
  name: fortune-cm-update-test
spec:
  containers:
  - image: nginx:alpine
    name: web-server
    volumeMounts:
    - name: config
      mountPath: /etc/nginx/conf.d
      readOnly: true
    ports:
    - containerPort: 80
  volumes:
  - name: config
    configMap:
      name: fortune-config
