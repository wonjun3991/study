apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
data:
  APP_NAME: fortune-demo
  APP_ENV: development
  LOG_LEVEL: debug
  sleep-interval: "15"   # 하이픈이 있는 key는 env로 못 들어감 (조용히 skip됨)
---
apiVersion: v1
kind: Pod
metadata:
  name: fortune-envfrom
spec:
  containers:
  - image: luksa/fortune:env
    name: html-generator
    envFrom:
    - prefix: CONFIG_
      configMapRef:
        name: app-config
    env:
    # INTERVAL은 따로 넣어야 함 (sleep-interval은 하이픈 때문에 자동 주입 불가)
    - name: INTERVAL
      valueFrom:
        configMapKeyRef:
          name: app-config
          key: sleep-interval
    volumeMounts:
    - name: html
      mountPath: /var/htdocs
  - image: nginx:alpine
    name: web-server
    volumeMounts:
    - name: html
      mountPath: /usr/share/nginx/html
      readOnly: true
    ports:
    - containerPort: 80
      protocol: TCP
  volumes:
  - name: html
    emptyDir: {}
