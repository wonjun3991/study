# Ch06 - emptyDir Volume
# fortune 컨테이너가 10초마다 index.html 생성 → nginx가 서빙
apiVersion: v1
kind: Pod
metadata:
  name: fortune
  labels:
    app: fortune
spec:
  containers:
  - image: luksa/fortune
    name: html-generator
    volumeMounts:
    - name: html
      mountPath: /var/htdocs
  - image: nginx:alpine
    name: web-server
    volumeMounts:
    - name: html
      mountPath: /usr/share/nginx/html
      readOnly: true
    ports:
    - containerPort: 80
      protocol: TCP
  volumes:
  - name: html
    emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: fortune
spec:
  type: NodePort
  selector:
    app: fortune
  ports:
  - port: 80
    targetPort: 80
    nodePort: 30080
