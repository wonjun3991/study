# Ch06 - StorageClass 동적 프로비저닝 (minikube standard 사용)
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mongodb-pvc-dynamic
spec:
  storageClassName: standard
  resources:
    requests:
      storage: 100Mi
  accessModes:
  - ReadWriteOnce
---
apiVersion: v1
kind: Pod
metadata:
  name: mongodb-dynamic
  labels:
    app: mongodb-dynamic
spec:
  containers:
  - image: mongo
    name: mongodb
    volumeMounts:
    - name: mongodb-data
      mountPath: /data/db
    ports:
    - containerPort: 27017
      protocol: TCP
  volumes:
  - name: mongodb-data
    persistentVolumeClaim:
      claimName: mongodb-pvc-dynamic
