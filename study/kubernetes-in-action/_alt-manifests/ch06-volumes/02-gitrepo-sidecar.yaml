# Ch06 - gitRepo Volume 대체
# gitRepo 볼륨은 deprecated 되었으므로 initContainer + emptyDir 패턴으로 구현
apiVersion: v1
kind: Pod
metadata:
  name: gitrepo-volume-pod
  labels:
    app: gitrepo
spec:
  initContainers:
  - name: git-clone
    image: alpine/git
    args:
    - clone
    - --single-branch
    - --
    - https://github.com/luksa/kubia-website-example.git
    - /html
    volumeMounts:
    - name: html
      mountPath: /html
  containers:
  - image: nginx:alpine
    name: web-server
    volumeMounts:
    - name: html
      mountPath: /usr/share/nginx/html
      readOnly: true
    ports:
    - containerPort: 80
      protocol: TCP
  volumes:
  - name: html
    emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: gitrepo
spec:
  type: NodePort
  selector:
    app: gitrepo
  ports:
  - port: 80
    targetPort: 80
    nodePort: 30081
