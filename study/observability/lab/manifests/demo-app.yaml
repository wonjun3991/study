# 데모 앱: loadgen → gateway → order → payment
# 모든 서비스는 같은 노드의 OTel Collector agent로 OTLP(gRPC)를 보낸다.
apiVersion: v1
kind: Namespace
metadata:
  name: demo
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-env
  namespace: demo
data:
  # agent Service (internalTrafficPolicy: Local → 같은 노드의 agent)
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-agent.observability.svc:4317
  OTEL_EXPORTER_OTLP_PROTOCOL: grpc
  OTEL_TRACES_EXPORTER: otlp
  OTEL_METRICS_EXPORTER: otlp
  OTEL_LOGS_EXPORTER: none              # 로그는 stdout → filelog 경로로만 수집 (중복 방지)
  OTEL_METRIC_EXPORT_INTERVAL: "15000"  # ms
  OTEL_RESOURCE_ATTRIBUTES: service.namespace=demo,deployment.environment.name=lab
  OTEL_PYTHON_EXCLUDED_URLS: healthz    # probe 요청은 trace에서 제외
  # Python 자동 계측은 기본값이 옛 HTTP semconv(http.server.duration, ms)다.
  # stable semconv(http.server.request.duration, s / http.response.status_code …)로 내보내게 한다.
  OTEL_SEMCONV_STABILITY_OPT_IN: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: demo
spec:
  replicas: 1
  selector:
    matchLabels: { app: gateway }
  template:
    metadata:
      labels: { app: gateway }
    spec:
      containers:
        - name: gateway
          image: demo-app:0.1
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef: { name: otel-env }
          env:
            - { name: SERVICE_ROLE, value: gateway }
            - { name: OTEL_SERVICE_NAME, value: gateway }
            - { name: DOWNSTREAM_URL, value: "http://order:8000" }
          ports:
            - { name: http, containerPort: 8000 }
          readinessProbe:
            httpGet: { path: /healthz, port: http }
          resources:
            requests: { cpu: 20m, memory: 96Mi }
            limits: { memory: 192Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: demo
spec:
  selector: { app: gateway }
  ports:
    - { name: http, port: 8000, targetPort: http }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order
  namespace: demo
spec:
  replicas: 1
  selector:
    matchLabels: { app: order }
  template:
    metadata:
      labels: { app: order }
    spec:
      containers:
        - name: order
          image: demo-app:0.1
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef: { name: otel-env }
          env:
            - { name: SERVICE_ROLE, value: order }
            - { name: OTEL_SERVICE_NAME, value: order }
            - { name: DOWNSTREAM_URL, value: "http://payment:8000" }
          ports:
            - { name: http, containerPort: 8000 }
          readinessProbe:
            httpGet: { path: /healthz, port: http }
          resources:
            requests: { cpu: 20m, memory: 96Mi }
            limits: { memory: 192Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: order
  namespace: demo
spec:
  selector: { app: order }
  ports:
    - { name: http, port: 8000, targetPort: http }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment
  namespace: demo
spec:
  replicas: 1
  selector:
    matchLabels: { app: payment }
  template:
    metadata:
      labels: { app: payment }
    spec:
      containers:
        - name: payment
          image: demo-app:0.1
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef: { name: otel-env }
          env:
            - { name: SERVICE_ROLE, value: payment }
            - { name: OTEL_SERVICE_NAME, value: payment }
            - { name: PAYMENT_SLOW_RATE, value: "0.1" }   # 10%는 1~2초 지연
            - { name: PAYMENT_ERROR_RATE, value: "0.05" } # 5%는 500 에러
          ports:
            - { name: http, containerPort: 8000 }
          readinessProbe:
            httpGet: { path: /healthz, port: http }
          resources:
            requests: { cpu: 20m, memory: 96Mi }
            limits: { memory: 192Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: payment
  namespace: demo
spec:
  selector: { app: payment }
  ports:
    - { name: http, port: 8000, targetPort: http }
---
# 초당 약 2건 요청을 계속 보내는 부하 생성기
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loadgen
  namespace: demo
spec:
  replicas: 1
  selector:
    matchLabels: { app: loadgen }
  template:
    metadata:
      labels: { app: loadgen }
    spec:
      containers:
        - name: loadgen
          image: curlimages/curl:8.11.1
          command: ["/bin/sh", "-c"]
          args:
            - |
              while true; do
                curl -s -o /dev/null -w "%{http_code} %{time_total}s\n" http://gateway:8000/checkout
                sleep 0.5
              done
          resources:
            requests: { cpu: 5m, memory: 16Mi }
            limits: { memory: 32Mi }
